      <div class="preloader-bar"><i></i></div>
      <p class="preloader-tip">LOADING THE JOURNEY</p>

  <div class="scroll-progress" aria-hidden="true">
    <span class="scroll-progress-bar" id="scrollProgressBar"></span>
  </div>

  <header class="site-header" id="siteHeader">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="index.html" aria-label="旅行日记首页">旅行日记</a>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">首页</a></li>

    </nav>

  <main id="main-content">

          <a class="back-link" href="journey.html">← 返回旅程日志</a>
          <p class="hero-eyebrow pill" id="trip-eyebrow">TRIP ALBUM</p>

          <div class="meta-chips" id="trip-chips" aria-label="旅程信息"></div>
          <p class="trip-brief" id="trip-brief"></p>
        </div>
      </header>

      <div class="container">
        <section class="section" aria-labelledby="trip-photos-title">
          <header class="section-head" data-reveal>
            <p class="eyebrow">PHOTO ALBUM</p>
            <h2 class="section-title" id="trip-photos-title">全部照片</h2>
            <p class="section-sub">点击任意一张可以放大，用 ←/→ 键或两侧箭头翻看。</p>
          </header>
          <div class="photo-wall trip-page-wall" id="trip-photos" aria-live="polite"></div>
        </section>

        <nav class="trip-neighbor-nav" aria-label="相邻旅程">
          <a class="trip-neighbor prev" id="trip-prev" href="journey.html">
            <span class="dir">← 上一段旅程</span>

          </a>
          <a class="trip-neighbor next" id="trip-next" href="journey.html">

            <b>—</b>
          </a>

  </footer>

  <button class="to-top" id="toTop" type="button" aria-label="回到顶部">

        <linearGradient id="totop-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#67e8f9" />
          <stop offset="1" stop-color="#818cf8" />
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="26" cy="26" r="22" />
      <circle class="ring-fg" cx="26" cy="26" r="22" />
    </svg>
    <span class="arrow" aria-hidden="true">↑</span>
  </button>
