  <header class="site-header">

      <p class="next-sub" id="next-date"></p>

        <div class="unit"><div class="num" id="cd-min">--</div><div class="label">分</div></div>
        <div class="unit"><div class="num" id="cd-sec">--</div><div class="label">秒</div></div>
      </div>
    </section>

    <div class="next-body">
      <div class="card">
        <div class="card-body">
          <h3>🗺️ 目的地地图</h3>
          <div id="next-map" style="height:340px;border-radius:12px;margin-top:12px"></div>

      </div>
      <div class="card">
        <div class="card-body">
          <h3>📝 旅行计划</h3>
          <p id="next-plan" style="margin-top:12px"></p>
          <h3 style="margin-top:20px">✨ 亮点清单</h3>
          <div id="next-highlights" class="highlight-pills"></div>

    </div>
